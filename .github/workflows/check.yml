name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting
        run: black --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: basedpyright
